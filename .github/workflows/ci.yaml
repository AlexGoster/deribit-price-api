name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: prices_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test -d prices_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest --cov=app --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:local-test-only@localhost:5432/prices_test
      - run: docker compose --env-file .env.example config --quiet
